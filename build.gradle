plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.firstdark.dev/snapshots' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
    compileOnly 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.41'
    runtimeOnly 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.41'
    compileOnly 'maven.modrinth:gzevkJbM:mc1.21.1-2.2.7-neoforge'
    runtimeOnly 'maven.modrinth:gzevkJbM:mc1.21.1-2.2.7-neoforge'
    compileOnly 'maven.modrinth:xaeros-minimap:Q1tuMQBB'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

}

test {
    useJUnitPlatform()
}

def verifyMixinPackageLayout = tasks.register('verifyMixinPackageLayout') {
    group = 'verification'
    description = 'Rejects ordinary classes inside the package owned by the Mixin config.'

    inputs.file('src/main/resources/life_contract.mixins.json')
    inputs.dir('src/main/java')

    doLast {
        def mixinConfig = new groovy.json.JsonSlurper().parse(file('src/main/resources/life_contract.mixins.json'))
        def mixinPackage = mixinConfig['package'] as String
        def mixinSourceDirectory = file("src/main/java/${mixinPackage.replace('.', '/')}")
        def allowedSourceNames = ['mixins', 'client', 'server'].collectMany { section ->
            (mixinConfig[section] ?: []) as List
        }.collect { mixinClassName ->
            mixinClassName.tokenize('.').last() + '.java'
        } as Set
        def configPlugin = mixinConfig['plugin'] as String
        if (configPlugin?.startsWith("${mixinPackage}.")) {
            allowedSourceNames.add(configPlugin.tokenize('.').last() + '.java')
        }
        def ordinaryClasses = fileTree(mixinSourceDirectory) {
            include '*.java'
        }.files.collect { it.name }.findAll { !allowedSourceNames.contains(it) }.sort()

        if (!ordinaryClasses.isEmpty()) {
            throw new GradleException(
                    "Ordinary classes cannot live in the configured Mixin package: ${ordinaryClasses.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyMixinPackageLayout
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
